name: Release launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (automatically applied, for example, 0.1.4)'
        required: true
        type: string
      notes:
        description: 'Launcher release notes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Windows installer
    if: github.ref == 'refs/heads/main' && github.repository == 'The-Signals/the-signal-launcher'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      # A repository-scoped token can grant Workflows access when GitHub
      # rejects creating a release tag at the exact built commit.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare release
        run: |
          @'
          import json, os, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          import sys
          sys.path.insert(0, 'scripts')
          from publish import VERSION
          if not VERSION.fullmatch(version):
              raise SystemExit('Enter a valid release version, for example 0.1.4.')
          repo = json.loads(Path('distribution.json').read_text())['launcher_repository']
          if repo != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Launcher distribution repository must match this repository.')
          tag = f'v{version}'
          tagged = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if tagged.returncode == 0 and tagged.stdout.strip() != os.environ['RELEASE_COMMIT']:
              raise SystemExit('Existing version tag points to a different commit. Use a new version.')
          result = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft'], capture_output=True, text=True)
          if result.returncode == 0:
              if not json.loads(result.stdout)['isDraft']:
                  raise SystemExit('This version is already published. Use a new version.')
          elif '404' not in result.stderr and 'release not found' not in result.stderr.lower():
              raise SystemExit(f'Unable to check release: {result.stderr}')
          Path(os.environ['RUNNER_TEMP'], 'launcher-notes.txt').write_text(os.environ['RELEASE_NOTES'], encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed.' }
      - name: Apply requested version to build checkout
        run: python scripts/set_launcher_version.py "$env:RELEASE_VERSION"
      - run: npm ci
      - name: Restore original updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw 'Set TAURI_SIGNING_PRIVATE_KEY in the release environment secrets.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'the-signal-launcher.key'
          [IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY)
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          [IO.File]::WriteAllText("$keyPath.pub", $config.plugins.updater.pubkey)
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -NoProfile -File scripts/build-launcher.ps1 -KeyPath "$env:RUNNER_TEMP/the-signal-launcher.key"
      - name: Verify real signed installer
        run: |
          $env:SIGNAL_TEST_INSTALLER = (Resolve-Path "src-tauri/target/release/bundle/nsis/The Signal Launcher_${env:RELEASE_VERSION}_x64-setup.exe").Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml validates_real_signed_launcher_artifact -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed.' }
      - name: Publish release and updater feed
        run: python scripts/publish_launcher.py --notes "$env:RUNNER_TEMP/launcher-notes.txt" --target "$env:RELEASE_COMMIT" --publish
      - name: Remove signing files
        if: always()
        run: |
          Remove-Item "$env:RUNNER_TEMP/the-signal-launcher.key", "$env:RUNNER_TEMP/the-signal-launcher.key.pub" -Force -ErrorAction SilentlyContinue
